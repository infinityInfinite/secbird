[workspace]
members = ["crates/secbird-core", "crates/secbird", "crates/secbird-tray"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityInfinite/secbird"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
