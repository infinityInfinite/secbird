name: Release

# Push a tag like v0.1.0 (or v0.1.0-rc1 for a test build). This builds the installer,
# the portable zip, the Linux CLI and checksums, and attaches them to a DRAFT release to review
# and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read  # SignPath downloads the unsigned artifacts with this job's token

jobs:
  # The CLI for Linux: one static binary (musl), so it runs on any x86_64 distribution.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo test --release -p secbird-core -p secbird
      - run: cargo build --release -p secbird --target x86_64-unknown-linux-musl
      - name: Tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="secbird-$version-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-musl/release/secbird packaging/linux/install.sh packaging/linux/70-secretarybird.rules README.md LICENSE-MIT LICENSE-APACHE NOTICE "dist/$name/"
          chmod 755 "dist/$name/secbird" "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "${tag%%-*}" = "$crate" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - run: cargo test --release
      - run: cargo build --release

      # Code signing through SignPath Foundation (see CODE_SIGNING_POLICY.md). Skipped until the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
      # The exes are signed first so the installer packs signed copies, then the installer itself.
      - name: Upload exes for signing
        id: upload-exes
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exes
          path: |
            target/release/secbird-tray.exe
            target/release/secbird.exe
          if-no-files-found: error

      - name: Sign exes
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: secbird
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: exes
          github-artifact-id: ${{ steps.upload-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/exes

      - name: Use the signed exes
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed/exes/secbird-tray.exe signed/exes/secbird.exe target/release/

      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //Qp "//DAppVersion=$VERSION" installer/secbird.iss

      - name: Upload installer for signing
        id: upload-installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: target/installer/Secretarybird-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: secbird
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp "signed/installer/Secretarybird-Setup-$VERSION.exe" target/installer/

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: Portable zip and checksums
        run: |
          mkdir -p dist/Secretarybird
          cp target/release/secbird-tray.exe target/release/secbird.exe README.md LICENSE-MIT LICENSE-APACHE dist/Secretarybird/
          cp NOTICE dist/Secretarybird/NOTICE.txt
          cp "target/installer/Secretarybird-Setup-$VERSION.exe" dist/
          (cd dist && 7z a -tzip "Secretarybird-$VERSION-portable.zip" Secretarybird >/dev/null && rm -r Secretarybird)
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [${VERSION%%-*}]" 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            printf '\n---\nFree code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).\n' >> notes.md
          fi

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease \
            --title "Secretarybird $VERSION" --notes-file notes.md
