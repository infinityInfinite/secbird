// ---------- Buttons ----------
// Values are action texts, as in `secbird button`.
const BTN_CHOICES = [
  ['Mouse', [['left', 'Left click'], ['right', 'Right click'], ['middle', 'Middle click'], ['back', 'Back'],
    ['forward', 'Forward'], ['double-click', 'Double click'], ['scroll-up', 'Scroll up'], ['scroll-down', 'Scroll down'],
    ['scroll-left', 'Scroll left'], ['scroll-right', 'Scroll right']]],
  ['Keyboard', [['key', 'Key or shortcut…'], ['turbo-key', 'Turbo key…']]],
  ['Turbo', [['turbo-left', 'Turbo left click'], ['turbo-right', 'Turbo right click']]],
  ['Sensitivity', [['dpi-up', 'DPI up'], ['dpi-down', 'DPI down'], ['dpi-cycle-up', 'DPI cycle'],
    ['dpi-cycle-down', 'DPI cycle down'], ['dpi-clutch', 'Sniper (DPI while held)…']]],
  ['Media', [['media:volume-up', 'Volume up'], ['media:volume-down', 'Volume down'], ['media:mute', 'Mute'],
    ['media:play-pause', 'Play / pause'], ['media:next-track', 'Next track'], ['media:previous-track', 'Previous track']]],
  ['Macro', [['macro', 'Play a macro…']]],
  ['Other', [['hypershift', 'HyperShift (hold)'], ['profile-cycle-up', 'Next on-board profile'],
    ['scroll-mode:1', 'Switch wheel free-spin'], ['disabled', 'Disabled']]],
];
const CHOICE_LABEL = Object.fromEntries(BTN_CHOICES.flatMap(g => g[1]));
const KEY_CODES = { Enter: 'enter', Escape: 'esc', Backspace: 'backspace', Tab: 'tab', Space: 'space', Minus: 'minus',
  Equal: 'equal', BracketLeft: 'lbracket', BracketRight: 'rbracket', Backslash: 'backslash', Semicolon: 'semicolon',
  Quote: 'quote', Backquote: 'grave', Comma: 'comma', Period: 'period', Slash: 'slash', CapsLock: 'capslock',
  PrintScreen: 'printscreen', ScrollLock: 'scrolllock', Pause: 'pause', Insert: 'insert', Home: 'home', PageUp: 'pageup',
  Delete: 'delete', End: 'end', PageDown: 'pagedown', ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up',
  NumLock: 'numlock', NumpadDivide: 'num-slash', NumpadMultiply: 'num-star', NumpadSubtract: 'num-minus', NumpadAdd: 'num-plus',
  NumpadEnter: 'num-enter', NumpadDecimal: 'num-period', ContextMenu: 'menu' };
const MOD_CODES = { ControlLeft: 'ctrl', ShiftLeft: 'shift', AltLeft: 'alt', MetaLeft: 'win',
  ControlRight: 'rctrl', ShiftRight: 'rshift', AltRight: 'ralt', MetaRight: 'rwin' };
const keyName = code => KEY_CODES[code] || (/^Key[A-Z]$/.test(code) && code.slice(3).toLowerCase())
  || (/^Digit\d$/.test(code) && code.slice(5)) || (/^Numpad\d$/.test(code) && 'num' + code.slice(6)) || (/^F\d{1,2}$/.test(code) && code.toLowerCase()) || null;
const NUM_SIGNS = { slash: '/', star: '*', minus: '-', plus: '+', enter: 'Enter', period: '.' };
const keyLabel = k => k.length === 1 ? k.toUpperCase()
  : /^num(\d)$/.test(k) ? 'Num ' + k.slice(3)
  : /^num-/.test(k) ? 'Num ' + NUM_SIGNS[k.slice(4)]
  : k.charAt(0).toUpperCase() + k.slice(1);
const combo = c => c.split('+').map(keyLabel).join('+');
const MODIFIER_ORDER = ['ctrl', 'shift', 'alt', 'win', 'rctrl', 'rshift', 'ralt', 'rwin'];

// Action text -> [choice, combo, number] for the controls, and back.
function splitAction(a) {
  let m;
  if ((m = /^turbo:key:(.+)@(\d+)$/.exec(a))) return ['turbo-key', m[1], m[2]];
  if ((m = /^turbo:(left|right)@(\d+)$/.exec(a))) return ['turbo-' + m[1], '', m[2]];
  if ((m = /^key:(.+)$/.exec(a))) return ['key', m[1], ''];
  if ((m = /^dpi-clutch:(\d+)/.exec(a))) return ['dpi-clutch', '', m[1]];
  if ((m = /^macro:(\d+)(?:@(\w+))?$/.exec(a))) return ['macro', m[1], m[2] || '1'];
  return [a, '', ''];
}
function joinAction(choice, keys, n) {
  if (choice === 'key') return keys ? 'key:' + keys : null;
  if (choice === 'turbo-key') return keys ? `turbo:key:${keys}@${n || 7}` : null;
  if (choice === 'turbo-left' || choice === 'turbo-right') return `turbo:${choice.slice(6)}@${n || 7}`;
  if (choice === 'dpi-clutch') return 'dpi-clutch:' + (n || 400);
  if (choice === 'macro') return keys ? 'macro:' + keys + (n && n !== '1' ? '@' + n : '') : null;
  return choice;
}
// Plain words for any action text.
function actionLabel(a) {
  if (!a) return '';
  let m;
  if ((m = /^key:(.+)$/.exec(a))) return 'Key ' + combo(m[1]);
  if ((m = /^turbo:key:(.+)@(\d+)$/.exec(a))) return `Turbo key ${combo(m[1])} · ${m[2]}/s`;
  if ((m = /^turbo:(.+)@(\d+)$/.exec(a))) return `Turbo ${(CHOICE_LABEL[m[1]] || m[1].replace(/-/g, ' ')).toLowerCase()} · ${m[2]}/s`;
  if ((m = /^dpi-clutch:(\d+)/.exec(a))) return `Sniper · ${m[1]} DPI`;
  if ((m = /^macro:(\d+)(?:@(\w+))?$/.exec(a))) {
    const mac = (macroData[dev.id] && macroData[dev.id].macros.find(x => x.id === +m[1]));
    const how = { hold: ' · while held', toggle: ' · toggle' }[m[2]] || (m[2] && m[2] !== '1' ? ` · ${m[2]}×` : '');
    return 'Macro ' + (mac ? `“${mac.name}”` : '#' + m[1]) + how;
  }
  if (CHOICE_LABEL[a]) return CHOICE_LABEL[a];
  if ((m = /^raw:(\d+):/.exec(a))) return `Set by Synapse (function ${m[1]})`;
  return a.replace(/[-:]/g, ' ').replace(/^./, c => c.toUpperCase());
}

async function loadButtons(d, force) {
  if ((d.kind !== 'mouse' && !BOARDS.includes(d.kind)) || (!force && btnData[d.id] !== undefined)) return;
  btnData[d.id] = null; // loading
  if (dev && dev.id === d.id && !showAll) renderSheet();
  try {
    const r = await api('/api/buttons', { id: d.id });
    btnData[d.id] = r.buttons; onboardData[d.id] = r.onboard; delete btnFailed[d.id];
  } catch { btnData[d.id] = []; btnFailed[d.id] = true; }
  if (dev && dev.id === d.id && !showAll) renderSheet();
}

function buttonEditor(box, name) {
  const b = (btnData[dev.id] || []).find(x => x.name === name); if (!b) return;
  const action = b[btnLayer], [choice, keys, n] = splitAction(action);
  const sel = el('select', { ariaLabel: b.label + ' action', id: 'btnSel' });
  let found = false;
  BTN_CHOICES.forEach(([group, opts]) => {
    if (isBoard() && group === 'Sensitivity') return; // a keyboard has no DPI
    const g = el('optgroup', { label: group });
    opts.filter(([v]) => !(isBoard() && v === 'scroll-mode:1'))
      .forEach(([v, t]) => { g.append(new Option(t, v, false, v === choice)); found ||= v === choice; });
    sel.append(g);
  });
  if (!found) sel.prepend(new Option(actionLabel(action) + ' (as saved)', action, false, true)); // only Synapse sets these
  const keyIn = el('input', { type: 'text', className: 'combo', readOnly: true, value: keys ? combo(keys) : '', placeholder: 'Press keys…', ariaLabel: 'Key for ' + b.label });
  keyIn.dataset.keys = keys;
  const numIn = el('input', { type: 'number', className: 'num', value: n });
  const numLabel = el('span', { className: 'val' });
  // Which macro, and how it plays: once, N times, while held, toggle.
  const macros = (macroData[dev.id] && macroData[dev.id].macros) || [];
  const macroSel = el('select', { ariaLabel: 'Macro for ' + b.label });
  macros.forEach(mc => macroSel.append(new Option(mc.name, mc.id, false, choice === 'macro' && String(mc.id) === keys)));
  const playSel = el('select', { ariaLabel: 'How the macro plays' });
  [['1', 'Once'], ['times', 'Several times'], ['hold', 'While held'], ['toggle', 'Toggle on / off']].forEach(([v, t]) =>
    playSel.append(new Option(t, v, false, choice === 'macro' && (v === n || (v === 'times' && /^\d+$/.test(n) && n !== '1')))));
  const macroArgs = () => {
    const play = playSel.value === 'times' ? String(Math.max(2, Math.min(255, +numIn.value || 2))) : playSel.value;
    return [macroSel.value, play];
  };
  const send = () => {
    const a = sel.value === 'macro' ? joinAction('macro', ...macroArgs()) : joinAction(sel.value, keyIn.dataset.keys, numIn.value);
    if (a) assign(b.name, a);
  };
  // Modifier toggles: Windows keeps some shortcuts (Win+D, Win+L, Alt+Tab) and the page never
  // sees the key, so press the key and then click the modifier (#25).
  const modBox = el('div', { className: 'seg mods', role: 'group', ariaLabel: 'Modifiers' });
  const setKeys = keys => {
    keyIn.dataset.keys = keys; keyIn.value = combo(keys);
    const parts = keys.split('+');
    modBox.querySelectorAll('button[data-m]').forEach(t => t.ariaPressed = parts.includes(t.dataset.m));
  };
  ['ctrl', 'shift', 'alt', 'win'].forEach(m => modBox.append(el('button', { textContent: keyLabel(m), ariaPressed: false, dataset: { m },
    title: 'Add or remove ' + keyLabel(m) + '. For shortcuts Windows keeps for itself, like Win+D: press the key, then click this.',
    onclick: () => {
      const parts = keyIn.dataset.keys ? keyIn.dataset.keys.split('+') : [];
      const on = new Set(parts.filter(p => MODIFIER_ORDER.includes(p)));
      on.has(m) ? on.delete(m) : on.add(m);
      const key = parts.find(p => !MODIFIER_ORDER.includes(p));

  const notes = group('Notifications and checks',
    row('DPI and profile popups', 'A small popup above the clock when DPI, the on-board profile or a game profile changes.', ...traySwitch('popups', 'DPI and profile popups')),
    row('Low battery warning', 'A notification when a wireless device drops to ' + a.battery_warning_at + '%.',
      batteryLevel(),
      ...traySwitch('battery_warning', 'Low battery warning')),
    row('New version notices', 'Once a day, asks GitHub whether a newer Secretarybird is out. Nothing else is sent.', checkOut, checkBtn, ...traySwitch('updates', 'New version notices')),
    row('Weekly firmware check', 'Once a week, asks Razer’s website whether newer firmware is out for your devices. It never installs anything.', ...traySwitch('firmware_weekly', 'Weekly firmware check')));

  // Profiles and backup
  const file = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const r = await api('/api/import', { data: JSON.parse(await f.text()) });
      devices = r.state.devices; devices.forEach(d => { d.profile = d.profile || {}; d.profilesData = d.profilesData || {}; d.profilesData[d.active] = d.profile; });
      dev = devices.find(d => dev && d.id === dev.id) || devices[0] || null;
      toast(r.added ? 'Added ' + plural(r.added, 'profile') + '; yours were kept. Pick one in the profile list.' : 'Nothing new in that file');
    } catch (err) { toast(err instanceof SyntaxError ? 'That file isn’t a Secretarybird backup' : err.message, true); }
    e.target.value = '';
  } });
  const backup = group('Profiles and backup',
    row('Back up profiles', 'Every profile of every device in one file.', el('button', { className: 'ghost', textContent: 'Save a backup', onclick: async () => {
      try {
        const data = await api('/api/export');
        const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        el('a', { href: url, download: 'secretarybird-profiles.json' }).click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } catch (e) { toast(e.message, true); }
    } })),
    row('Restore from a backup', 'Adds the profiles in a backup file. Yours are kept; a clashing name gets “(imported)”.', file,
      el('button', { className: 'ghost', textContent: 'Choose a file…', onclick: () => file.click() })),
    row('Settings folder', a.folder, el('button', { className: 'ghost', textContent: 'Open', onclick: () => api('/api/open-folder', {}).catch(e => toast(e.message, true)) })));

  // Help
  const reportBtn = el('button', { className: 'ghost', textContent: 'Copy report and open GitHub', onclick: async () => {
    reportBtn.disabled = true; reportBtn.textContent = 'Reading the devices…';
    try {
      const r = await api('/api/report', {});
      await navigator.clipboard.writeText(r.text);
      window.open(a.repository + '/issues/new?template=device-report.yml', '_blank', 'noopener');
      toast('Report copied: paste it into “Output of secbird report”');
    } catch (e) { toast(e.message, true); }
    reportBtn.disabled = false; reportBtn.textContent = 'Copy report and open GitHub';
  } });
  const mice = devices.filter(d => d.kind === 'mouse');
  const help = group('Help',
    row('Device report', 'A read-only description of your devices for a GitHub issue, when one is missing or misbehaves. Serial numbers are shortened.', reportBtn),
    mice.length ? row('Restore all mouse buttons', 'Every remapped button on every mouse back to what the mouse stores (factory or Synapse), and the remaps forgotten.',
      el('button', { className: 'ghost', textContent: 'Restore all', onclick: async () => {
        if (!confirm('Put every mouse button back to what the mouse stores?')) return;
        try {
          const r = await api('/api/restore-all-buttons', {});
          btnData = {};
          toast(r.results.map(x => x.error ? x.device + ': ' + x.error : x.device + ': ' + plural(x.restored, 'button') + ' restored').join(' · ') || 'No mouse with remappable buttons', r.results.some(x => x.error));
          load();
        } catch (e) { toast(e.message, true); }
      } })) : null,
    row('Razer Synapse', a.synapse.length ? 'Running (' + a.synapse.join(', ') + '). It can overwrite these settings. `secbird debloat` stops it starting with Windows.' : 'Not running. Good: nothing will overwrite your settings.'),
    row('About', 'Secretarybird ' + a.version + '. Not affiliated with Razer. It goes online only for the daily version check and, if on, the weekly firmware check.',
      el('a', { href: a.repository, target: '_blank', rel: 'noopener noreferrer', textContent: 'GitHub' })));

  box.replaceChildren(el('div', { className: 'set-wrap' },
    el('div', { className: 'set-head' }, el('h1', { textContent: 'Settings' }), el('p', { textContent: 'Changes apply right away. Esc goes back.' })),
    editor, startup, notes, backup, help));
  box.scrollTop = top;
}

// ---------- Overview ----------

function renderOverview() {
  const zones = devices.reduce((n, d) => n + d.leds.length, 0);
  $('ovSummary').textContent = [plural(devices.length, 'device'), zones && plural(zones, 'lighting zone'),
    unsupported.length && unsupported.length + ' not controllable yet'].filter(Boolean).join(' · ');
  // One card per device, under a heading per kind; groups with no devices are left out.
  const card = d => {
    const sub = el('div', { className: 'dsub' }, el('span', { className: 'ell', textContent: (KINDS[d.kind] || 'Device') + ' · ' + d.active }));
    if (d.battery != null) {
      const b = el('span', { className: 'batt num' + (d.battery < 20 ? ' low' : ''), innerHTML: '<b></b>' });
      b.firstChild.style.setProperty('--lvl', d.battery / 100); b.append(d.battery + '%'); sub.append(b);
    }
    const dots = el('div', { className: 'dots' });
    const p = d.profile || {}, keys = p.keys, perKey = keys && keys.length;
    const colors = perKey ? [...new Set(keys.filter(k => k !== '000000'))].slice(0, 8).map(k => ({ color: k })) : d.leds.map(l => zoneOf(p, l.name));
    if (d.lighting_control) colors.forEach(z => { const i = el('i'), paint = zonePaint(z); if (paint) i.style.background = paint; else i.className = 'off'; dots.append(i); });
    const stats = [d.dpi && ['DPI', dpiLabel(d.dpi)], d.polling && ['Polling', hz(d.polling.hz)], perKey && ['Lighting', 'Per-key']].filter(Boolean);
    if (!stats.length) stats.push(['Lighting', d.lighting_control ? plural(d.leds.length, 'zone') : (d.leds.length || d.matrix ? 'Not controlled' : 'None'), 'quiet']);
    const foot = el('div', { className: 'dfoot' },
      el('div', { className: 'dstats num' }, ...stats.map(([label, value, quiet]) => el('div', {}, el('small', { textContent: label }), el('b', { className: quiet || '', textContent: value })))),
      dots);
    return el('button', { className: 'dcard', onclick: () => openDevice(d) }, artTile(d),
      el('div', { className: 'did' }, el('h3', { textContent: devLabel(d), title: devLabel(d) }), sub), foot);
  };
  const groups = [
    ['Mice', 'mouse', d => d.kind === 'mouse'],
    ['Keyboards and keypads', 'keyboard-tkl', d => d.kind === 'keyboard' || d.kind === 'keypad'],
    ['Headsets', 'headset', d => d.kind === 'headset'],
    ['Everything else', 'device', d => !['mouse', 'keyboard', 'keypad', 'headset'].includes(d.kind)],
  ];
  const box = $('ovGroups');
  box.innerHTML = '';
  const group = (title, art, cards) => {
    if (!cards.length) return;
    box.append(el('h2', { className: 'ov-group', innerHTML: `<svg class="dart" viewBox="0 0 24 24" aria-hidden="true">${ART[art]}</svg>` }, title, el('span', { textContent: '· ' + cards.length })),
      el('div', { className: 'ov-grid' }, ...cards));
  };
  groups.forEach(([title, art, match]) => group(title, art, devices.filter(match).map(card)));
  group('Connected, not controllable yet', 'device', unsupported.map(u => el('div', { className: 'dcard muted' }, artTile(u),
    el('div', { className: 'did' }, el('h3', { textContent: u.name, title: u.name }), el('div', { className: 'dsub' }, el('span', { textContent: u.pid + ' · Connected' }))),
    el('div', { className: 'dfoot' }, el('div', { className: 'dstats' }, el('div', {}, el('small', { textContent: 'Why' }), el('b', { className: 'quiet', textContent: u.reason })))))));
}

// ---------- Live updates, loading, global actions ----------

// Follow DPI changes made with the mouse's own DPI button. The tray answers from memory
// (no device access), and only reports newer than the last poll are applied, so a DPI
// just set here is never undone. Paused while the page is hidden.
let liveSeq = null;
async function pollLive() {
  if (document.hidden) return;
  try {
    const r = await api('/api/live');
    if (liveSeq !== null && r.seq !== liveSeq) {
      for (const d of devices) {
        const v = r.dpi[d.id];
        if (v && d.dpi && (d.dpi.x !== v[0] || d.dpi.y !== v[1])) {
          d.dpi.x = v[0]; d.dpi.y = v[1];
          if (d.profile) d.profile.dpi = [v[0], v[1]];
          if (showAll) renderOverview(); else if (dev && d.id === dev.id) showDpi();
        }
      }
    }
    liveSeq = r.seq;
  } catch { /* the tray may be busy; try again next tick */ }
}
setInterval(pollLive, 1000);

async function load(path = '/api/state', body) {
  try {
    const s = body ? await api(path, body) : await api(path);
    devices = s.devices; unsupported = s.unsupported || []; synapse = s.synapse || [];
    devices.forEach(d => { d.profile = d.profile || {}; d.profilesData = d.profilesData || {}; d.profilesData[d.active] = d.profile; });
    if (s.version) $('home').title = 'Secretarybird ' + s.version + ': all devices';
    const want = new URLSearchParams(location.search).get('d');
    const wanted = d => d.pid === want || d.id === want;
    dev = devices.find(d => dev && d.id === dev.id) || devices.find(wanted) || devices[0] || null;
    if (showAll === null) showAll = !devices.some(wanted) && (devices.length > 1 || unsupported.length > 0);
    if (!dev) sel = null;
    render();
  } catch (e) { toast(e.message, true); }
}
// Sync: one color (the top bar), or a zone's color or effect (its panel), on every zone of
// every device; effects start together. Dragging the swatch syncs live.
let syncing = null;
const sendSync = live(async what => {
  syncing = what;
  const r = await api('/api/sync', { color: what.color || '', effect: what.effect || '' });
  devices = r.state.devices; unsupported = r.state.unsupported || []; synapse = r.state.synapse || [];
  devices.forEach(d => { d.profile = d.profile || {}; d.profilesData = d.profilesData || {}; d.profilesData[d.active] = d.profile; });
  dev = devices.find(d => d.id === dev.id) || devices[0];
  render();
  const skipped = r.skipped || [];
  const cant = skipped.length ? ` ${skipped.join(', ')} can’t show it.` : '';
  if (!r.zones) throw new Error(r.failed.length ? 'Nothing synced: ' + r.failed.join('; ') : 'Nothing synced.' + cant);
  if (r.failed.length) throw new Error('Some zones failed: ' + r.failed.join('; '));
  return r;
}, r => {
  const skipped = r.skipped || [];
  return (syncing.effect ? effectLabel(syncing.effect) : '#' + syncing.color) + ' on ' + plural(r.zones, 'zone') + ' across ' + plural(r.devices, 'device') +
    (skipped.length ? `. ${skipped.join(', ')} can’t show it.` : '');
});
// Theme: Auto follows Windows; a picked theme is remembered in this browser. Older builds
// stored 'dark' or 'light' from a light/dark toggle: 'dark' now means the default (Auto).
const themeKey = 'secbird-theme';
const THEMES = ['bridge', 'roast', 'classic', 'light', 'workshop', 'neon', 'acid'];
function setTheme(t) {
  const root = document.documentElement;
  if (THEMES.includes(t)) root.dataset.theme = t; else delete root.dataset.theme;
  $('theme').value = root.dataset.theme || '';
  requestAnimationFrame(() => { placeUnderline(); placeBand(); });
}
try { const t = localStorage.getItem(themeKey); setTheme(t === 'dark' ? '' : t); } catch (e) { }
if (remembered('motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
$('theme').onchange = e => {
  setTheme(e.target.value);
  try { if (e.target.value) localStorage.setItem(themeKey, e.target.value); else localStorage.removeItem(themeKey); } catch (err) { }
};
$('home').onclick = () => { if (devices.length || unsupported.length) { showAll = true; showSettings = false; sel = null; render(); } };
$('gear').innerHTML = icon('gear');
$('gear').onclick = () => { showSettings = !showSettings; sel = null; render(); };
const topColor = () => ({ color: $('syncColor').value.slice(1).toUpperCase() });
$('syncColor').oninput = () => { syncPicked = true; sendSync(topColor()); };
$('syncBtn').onclick = () => sendSync(topColor());
const updateTabsRow = scrollRow($('tabsRow')), updateProfilesRow = scrollRow($('profilesRow'));
// Narrow windows lay the sections out as a row: the wheel scrolls it and a fade shows there is more.
(() => {
  const rail = $('rail');
  const update = () => rail.classList.toggle('more-r', rail.scrollWidth - rail.clientWidth > 1 && rail.scrollLeft + rail.clientWidth < rail.scrollWidth - 1);
  rail.addEventListener('scroll', update, { passive: true });
  rail.addEventListener('wheel', e => {
    if (getComputedStyle(rail).flexDirection !== 'row' || rail.scrollWidth <= rail.clientWidth) return;
    rail.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; e.preventDefault();
  }, { passive: false });
  new ResizeObserver(update).observe(rail);
  new MutationObserver(update).observe(rail, { childList: true });
})();
$('rescan').onclick = () => { btnData = {}; macroData = {}; load('/api/rescan', {}); };
// Coming back to the window: refresh, but leave an open editor alone.
window.addEventListener('focus', () => { if (!sel) load(); });
load();
</script>
</body>
</html>
