<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secretarybird</title>
<link rel="icon" type="image/png" href="{{LOGO}}">
<style>
  /* Themes. Each sets every token; the accent means live, selected, changed or focused, and
     the value colour carries numbers. Auto follows Windows: Bridge when dark, Light when light. */
  :root { --fill: var(--accent); }
  :root, :root[data-theme="bridge"] { --bg: #050505; --bar: #0d0d0e; --panel: #131314; --raise: #1b1b1d; --line: #242426; --line-strong: #4a4440; --text: #f4efe9; --muted: #b8aea3; --faint: #9c9287; --value: #ffb85d; --accent: #ff5412; --accent-text: #ff7a45; --on-accent: #000; --lit: #ff541224; --lit-edge: #ff5412; --toast: #1b1b1d; --zone-off: #242426; --body-fill: #131314; --body-stroke: #3a3632; --button-fill: #1b1b1d; --key-fill: #1b1b1d; --key-stroke: #34312e; --key-text: #f4efe999; --warn-line: #ffb85d55; --warn-bg: #ffb85d14; --warn-text: #ffb85d; --err: #ff4a5a; --err-text: #ffb4bb; --shadow: 0 12px 32px -14px #000000e6; color-scheme: dark; }
  :root[data-theme="roast"] { --bg: #150d05; --bar: #1e1007; --panel: #201002; --raise: #2b1909; --line: #3a2916; --line-strong: #64492b; --text: #f5e0d3; --muted: #b58754; --faint: #ad8150; --value: #e2aa6b; --accent: #e6c08f; --accent-text: #efcf9f; --on-accent: #1e1007; --lit: #e6c08f26; --lit-edge: #e6c08f; --toast: #2b1909; --zone-off: #3a2916; --body-fill: #201002; --body-stroke: #4a2b09; --button-fill: #2b1909; --key-fill: #2b1909; --key-stroke: #4a2b09; --key-text: #f5e0d399; --warn-line: #f8ac6055; --warn-bg: #f8ac6014; --warn-text: #f8ac60; --err: #ff5a4e; --err-text: #ffb4a8; --shadow: 0 12px 32px -14px #000000d9; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme]) { --bg: #f4f4f7; --bar: #ffffff; --panel: #ffffff; --raise: #f0f0f4; --line: #e1e1e8; --line-strong: #c3c3cc; --text: #18181d; --muted: #5f5f6b; --faint: #6c6c78; --value: #18181d; --accent: #4f86ec; --accent-text: #1d4ed8; --on-accent: #0f2a66; --fill: #cfe0ff; --lit: #4f86ec1a; --lit-edge: #4f86ec; --toast: #ffffff; --zone-off: #d9d9df; --body-fill: #f1f1f4; --body-stroke: #c4c4cc; --button-fill: #e4e4ea; --key-fill: #ececf0; --key-stroke: #cfcfd7; --key-text: #00000099; --warn-line: #c9a20055; --warn-bg: #fff7d6; --warn-text: #6b5200; --err: #d70015; --err-text: #b3261e; --shadow: 0 10px 30px -14px #1b1b3040; color-scheme: light; } }
  :root[data-theme="classic"] { --bg: #0d0d10; --bar: #111115; --panel: #15151a; --raise: #1b1b21; --line: #25252d; --line-strong: #3a3a44; --text: #ececf1; --muted: #9a9aa6; --faint: #858591; --value: #ececf1; --accent: #5b9cff; --accent-text: #8bb8ff; --on-accent: #000; --lit: #5b9cff1f; --lit-edge: #5b9cff; --toast: #222229; --zone-off: #2a2a31; --body-fill: #141418; --body-stroke: #2b2b33; --button-fill: #1d1d23; --key-fill: #1b1b21; --key-stroke: #2e2e37; --key-text: #ffffff99; --warn-line: #ffd60a55; --warn-bg: #ffd60a12; --warn-text: #ffe58a; --err: #ff453a; --err-text: #ffb4ae; --shadow: 0 10px 30px -12px #000000cc; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f4f4f7; --bar: #ffffff; --panel: #ffffff; --raise: #f0f0f4; --line: #e1e1e8; --line-strong: #c3c3cc; --text: #18181d; --muted: #5f5f6b; --faint: #6c6c78; --value: #18181d; --accent: #4f86ec; --accent-text: #1d4ed8; --on-accent: #0f2a66; --fill: #cfe0ff; --lit: #4f86ec1a; --lit-edge: #4f86ec; --toast: #ffffff; --zone-off: #d9d9df; --body-fill: #f1f1f4; --body-stroke: #c4c4cc; --button-fill: #e4e4ea; --key-fill: #ececf0; --key-stroke: #cfcfd7; --key-text: #00000099; --warn-line: #c9a20055; --warn-bg: #fff7d6; --warn-text: #6b5200; --err: #d70015; --err-text: #b3261e; --shadow: 0 10px 30px -14px #1b1b3040; color-scheme: light; }
  :root[data-theme="workshop"] { --bg: #ede7dc; --bar: #e0d7c7; --panel: #f7f3ec; --raise: #e8e0d2; --line: #d6ccb9; --line-strong: #b3a68d; --text: #3d362a; --muted: #5c5141; --faint: #62564a; --value: #8a3f1b; --accent: #3f6e45; --accent-text: #2f5a35; --on-accent: #fff; --lit: #3f6e4533; --lit-edge: #3f6e45; --toast: #f7f3ec; --zone-off: #d6ccb9; --body-fill: #e8e0d2; --body-stroke: #b3a68d; --button-fill: #e0d7c7; --key-fill: #e8e0d2; --key-stroke: #cbbfa8; --key-text: #3d362a99; --warn-line: #a6672255; --warn-bg: #e7a2652a; --warn-text: #5a3412; --err: #c2181a; --err-text: #a3171a; --shadow: 0 12px 32px -16px #3d362a40; color-scheme: light; }
  :root[data-theme="neon"] { --bg: #160520; --bar: #1e0829; --panel: #250a33; --raise: #2f0d40; --line: #45185a; --line-strong: #6b2a85; --text: #f1e3d0; --muted: #c99ec6; --faint: #ad80ab; --value: #fbb550; --accent: #dd3290; --accent-text: #f26cb4; --on-accent: #000; --lit: #dd32902e; --lit-edge: #dd3290; --toast: #2f0d40; --zone-off: #45185a; --body-fill: #250a33; --body-stroke: #5a1f73; --button-fill: #2f0d40; --key-fill: #2f0d40; --key-stroke: #5a1f73; --key-text: #f1e3d099; --warn-line: #fbb55055; --warn-bg: #fbb55014; --warn-text: #fbb550; --err: #ff5a6e; --err-text: #ffb4c0; --shadow: 0 12px 32px -14px #000000d9; color-scheme: dark; }
  :root[data-theme="acid"] { --bg: #050605; --bar: #0b0d0b; --panel: #111411; --raise: #181c18; --line: #222822; --line-strong: #3a4838; --text: #eaf2e8; --muted: #a6b4a3; --faint: #8e9c8b; --value: #b9f0a8; --accent: #44d62c; --accent-text: #5fe048; --on-accent: #000; --lit: #44d62c24; --lit-edge: #44d62c; --toast: #181c18; --zone-off: #222822; --body-fill: #111411; --body-stroke: #2f3a2e; --button-fill: #181c18; --key-fill: #181c18; --key-stroke: #2c352b; --key-text: #eaf2e899; --warn-line: #ffd25e55; --warn-bg: #ffd25e14; --warn-text: #ffd25e; --err: #ff4d5e; --err-text: #ffb4bb; --shadow: 0 12px 32px -14px #000000e6; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--lit); color: var(--text); }
  input, textarea { caret-color: var(--accent); }
  html { scrollbar-color: var(--line-strong) transparent; accent-color: var(--accent); }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .pct-box { display: inline-flex; align-items: center; height: 36px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pct-box:hover { border-color: var(--line-strong); }
  .pct-box:focus-within { border-color: var(--accent); }
  .pct-box input.pct { width: 3ch; padding: 0 !important; border: 0 !important; background: none !important; text-align: right; font-weight: 650; appearance: textfield; }
  .pct-box input.pct::-webkit-inner-spin-button, .pct-box input.pct::-webkit-outer-spin-button { appearance: none; margin: 0; }
  .pct-box input.pct:focus-visible { outline: none; }
  .pct-box .unit { color: var(--muted); font-weight: 600; padding: 0 4px 0 1px; }
  .pct-box button { width: 32px; height: 100%; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
  .pct-box button:hover:not(:disabled) { color: var(--text); background: var(--panel); }
  .pct-box button:disabled { opacity: .35; cursor: default; }
  .ico { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; flex: none; }

  /* Top bar: brand, devices, actions for every device. */
  header.top { display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 52px; flex: none; background: var(--bar); border-bottom: 1px solid var(--line); }
  .brand { background: none; border: 0; padding: 4px 6px 4px 0; cursor: pointer; font-weight: 650; display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 24px; height: 24px; border-radius: 7px; }
  .tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1; }
  /* A row that can hold more than fits (devices, profiles): arrows and a fade show there is more. */
  .scrollrow { position: relative; display: flex; align-items: center; min-width: 0; flex: 1; }
  .scrollrow > nav { scroll-behavior: smooth; }
  .scrollrow.more-r > nav { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
  .scrollrow.more-l > nav { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); }
  .scrollrow.more-l.more-r > nav { -webkit-mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
  .arrow { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .arrow:hover { color: var(--text); border-color: var(--line-strong); }
  .arrow .ico { width: 13px; height: 13px; }
  .arrow.l { margin-right: 4px; }
  .arrow.r { margin-left: 4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; flex: none; background: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; color: var(--muted); cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected=true] { border-color: var(--line); color: var(--text); background: var(--panel); }
  .actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .ghost { white-space: nowrap; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .ghost:hover { color: var(--text); border-color: var(--line-strong); }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }
  .ghost[aria-pressed=true] { color: var(--text); border-color: var(--accent); }
  .sync { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding-left: 9px; }
  .sync:hover { border-color: var(--line-strong); }
  .sync button { background: none; border: 0; padding: 6px 12px 6px 8px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .sync button:hover { color: var(--text); }
  .mini { position: relative; width: 18px; height: 18px; border-radius: 5px; overflow: hidden; border: 1px solid #00000066; flex: none; cursor: pointer; }
  .mini input { position: absolute; inset: -8px; width: 34px; height: 34px; border: 0; padding: 0; cursor: pointer; }
  .themepick { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding-left: 9px; }
  .themepick:hover { border-color: var(--line-strong); color: var(--text); }
  .themepick svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
  .themepick select { border: 0; background-color: transparent; padding: 6px 28px 6px 2px; color: inherit; }
  .banner { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-text); font-size: 13px; flex: none; }
  .banner code { font-family: ui-monospace, Consolas, monospace; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px 20px; }

  /* Device bar: what this is, its live look, and which profile is live. */
  .devbar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex: none; background: var(--bar); border-bottom: 1px solid var(--line); }
  .devbar svg#preview { width: 30px; height: 45px; flex: none; }
  .who { min-width: 0; flex: 0 1 auto; max-width: 34%; }
  .who h1 { margin: 0; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-shape { transition: fill .15s, stroke .15s, opacity .15s; cursor: pointer; }
  .m-body { fill: var(--body-fill); stroke: var(--body-stroke); }
  .m-line { stroke: var(--body-stroke); }

  /* Profile switcher: the live profile carries the ember underline, which slides when it changes. */
  .profiles { position: relative; display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  #profilesRow { flex: 1; }
  .profiles::-webkit-scrollbar { display: none; }
  /* Sideways-scrolling rows clip vertically too: room above and below so focus rings show whole. */
  .tabs, .profiles { padding-top: 5px; padding-bottom: 5px; margin-top: -5px; margin-bottom: -5px; }
  .pbtn { position: relative; flex: none; white-space: nowrap; background: none; border: 0; border-radius: 8px; padding: 7px 12px 9px; color: var(--muted); cursor: pointer; font-weight: 600; }
  .pbtn:hover { color: var(--text); background: var(--raise); }
  .pbtn[aria-current=true] { color: var(--text); }
  .pbtn .g { font-weight: 400; color: var(--faint); font-size: 12px; margin-left: 6px; }
  .uline { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; border-radius: 3px; background: var(--accent); pointer-events: none;
    transition: transform .35s cubic-bezier(.16, 1, .3, 1), width .35s cubic-bezier(.16, 1, .3, 1); }
  .padd { flex: none; background: none; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 6px 11px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; }
  .padd:hover { color: var(--text); border-color: var(--muted); }
  .newform { display: flex; align-items: center; gap: 6px; flex: none; margin-left: 6px; }
  .newform input { width: 170px; }
  .devright { display: flex; align-items: center; gap: 8px; flex: none; }

  /* Workbench: sections, tiles, edit panel. Fills the window; nothing below the fold. */
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 196px minmax(0, 1fr) 384px; }
  .work.wide { grid-template-columns: 196px minmax(0, 1fr); }
  .work.wide .tiles { display: none; }
  .rail { background: var(--bar); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sec { display: grid; gap: 1px; text-align: left; background: none; border: 1px solid transparent; border-radius: 9px; padding: 8px 12px; cursor: pointer; color: var(--muted); }
  .sec b { font-weight: 600; color: var(--text); font-size: 14px; }
  .sec span { font-size: 12px; display: flex; align-items: center; gap: 5px; min-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sec:hover { background: var(--raise); }
  .sec[aria-current=true] { background: var(--panel); border-color: var(--accent); }
  .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #00000066; flex: none; }
  .dot.off { background: none; border: 1.5px dashed var(--line-strong); }

  .tiles { overflow-y: auto; padding: 16px 20px 20px; min-width: 0; }
  .sechead { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; min-height: 30px; flex-wrap: wrap; }
  .sechead h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .sechead .tools { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 8px; }
  .tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px; min-height: 62px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: border-color .12s, background-color .12s; }
  .tile:hover { border-color: var(--line-strong); }
  .tile[aria-pressed=true] { border-color: var(--lit-edge); background: var(--lit); }
  .tile:disabled { cursor: progress; }
  .tl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv { display: block; min-height: 22px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv .sw { vertical-align: -3px; margin-right: 7px; }
  .tile.changed .tl::after { content: " · changed"; color: var(--accent-text); }
  .tile.changed .tv { color: var(--accent-text); }
  .tv .unset { color: var(--faint); font-weight: 400; }
  /* Laptop keyboard when idle: one tile per choice, its keycap lit as bright as the keyboard stays. */
  .dimgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .dimgrid .tile { flex-direction: row; align-items: center; gap: 11px; min-height: 0; padding: 10px 12px; }
  .dimgrid .tile > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .dimgrid .tv, .dimgrid .tl { white-space: normal; overflow: visible; line-height: 1.3; min-height: 0; }
  .dimkey { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--accent) calc(var(--lvl) * 100%), transparent); }
  @media (max-width: 420px) { .dimgrid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { .tile .tv { white-space: normal; overflow-wrap: anywhere; } }
  .tv small { color: var(--muted); font-weight: 400; }
  .big { font-size: 17px; font-weight: 650; color: var(--value); }
  .sw { width: 16px; height: 16px; border-radius: 5px; border: 1px solid #00000066; flex: none; display: inline-block; }
  .sw.off { background: none; border: 1.5px dashed var(--line-strong); }
  .subhead { margin: 18px 0 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .morekeys summary { cursor: pointer; width: fit-content; }
  /* Naga side grid: a keypad, laid out like the mouse. */
  .keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 168px)); gap: 6px; }
  .keypad .tile { min-height: 52px; padding: 6px 10px 7px; }
  .keypad .tl { color: var(--value); font-weight: 650; font-size: 13px; }
  .skel { height: 62px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .uline { transition: none; } .skel { animation: none; } }

  .panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .phead h2 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xbtn { background: none; border: 1px solid transparent; border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
  .xbtn:hover { color: var(--text); border-color: var(--line); }
  .xbtn .ico { width: 13px; height: 13px; }
  .pbody { overflow-y: auto; padding: 16px 18px 20px; flex: 1; min-height: 0; }
  .edbox { display: flex; flex-direction: column; gap: 20px; }
  .work.wide .edbox { flex-direction: row; flex-wrap: wrap; gap: 18px 28px; }
  .edbox h3 { margin: 0 0 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .edbox .note { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 60ch; }
  .edgroup { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lead { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  select, input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  textarea { width: 100%; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  select:hover, input:hover, textarea:hover { border-color: var(--line-strong); }
  select { appearance: none; padding-right: 30px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  input[type=radio], input[type=checkbox]:not(.switch) { appearance: none; width: 16px; height: 16px; margin: 0; flex: none; cursor: pointer;
    border: 1.5px solid var(--line-strong); background: var(--bg); }
  input[type=radio] { border-radius: 50%; }
  input[type=checkbox]:not(.switch) { border-radius: 4px; }
  input[type=radio]:checked, input[type=checkbox]:not(.switch):checked { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--bg); }
  .presets { display: grid; grid-template-columns: repeat(5, 36px); gap: 7px; }
  .presets button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #00000066; cursor: pointer; transition: transform .12s; }
  .presets button:hover { transform: translateY(-2px); }
  .presets button[aria-pressed=true] { outline: 2px solid var(--text); outline-offset: 2px; }
  .swatch { position: relative; width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line-strong); overflow: hidden; flex: none; }
  .swatch input { position: absolute; inset: -10px; width: 60px; height: 60px; border: 0; padding: 0; cursor: pointer; }
  .swatch.none::after { content: ""; position: absolute; inset: 0; border-radius: 8px; background: var(--panel); border: 1.5px dashed var(--line-strong); pointer-events: none; }
  input[type=range]:disabled { opacity: .35; cursor: not-allowed; }
  .hex { width: 96px; text-transform: uppercase; font-family: ui-monospace, Consolas, monospace; }
  .hex::placeholder { text-transform: none; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  input[type=range] { width: 100%; max-width: 300px; appearance: none; height: 22px; background: none; cursor: pointer; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--line-strong); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--line-strong); }
  input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]:focus-visible { outline: none; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--accent), 0 0 0 5px var(--lit); }
  .val { min-width: 44px; color: var(--muted); }
  .switch { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; flex: none; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { left: 19px; }
  .dpi { font-size: 30px; font-weight: 650; width: 130px; background: none !important; border: 0 !important; padding: 0 !important; color: var(--value); appearance: textfield; }
  .dpi::-webkit-inner-spin-button, .dpi::-webkit-outer-spin-button { appearance: none; margin: 0; }
  .readout { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
  .readout:focus-within { border-color: var(--accent); }
  .readout .dpi { width: 100%; text-align: center; font-size: 32px; line-height: 1.1; }
  .readout .dpi:focus-visible { outline: none; }
  .readout .unit { display: block; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; margin-top: 2px; }
  .step { width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .step:hover { border-color: var(--line-strong); }
  .step .ico { width: 14px; height: 14px; }
  .scale { display: flex; flex-direction: column; gap: 4px; }
  .scale input[type=range] { max-width: none; }
  .ends { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; }
  .chips5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 6px; }
  .chips5 .pill { border-radius: 8px; padding: 7px 0; text-align: center; }
  .chips5 .pill[aria-pressed=true] { background: var(--fill); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .stage-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .stage-values { display: flex; gap: 8px; min-width: 0; }
  .stage-values label { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; }
  #stageRows .dpi { display: block; font-size: 17px; width: 100%; }
  .stage-use { grid-column: 2; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; color: var(--muted); }
  .pill:hover { color: var(--text); }
  .pill[aria-pressed=true] { color: var(--text); border-color: var(--accent); }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
  .seg button { background: none; border: 0; border-radius: 7px; padding: 5px 12px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed=true] { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .sechead .seg button { padding: 3px 11px; font-size: 12.5px; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); }
  .link:hover, .link:focus-visible, a:hover { color: var(--text); text-decoration-color: currentColor; }
  a { color: var(--value); text-underline-offset: 3px; }
  .combo { width: 150px; font-family: ui-monospace, Consolas, monospace; cursor: pointer; }
  .combo:focus { border-color: var(--accent); }
  .danger { color: var(--err-text); }
  .danger:hover { color: var(--err-text); border-color: var(--err); }
  .macro { display: grid; gap: 3px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
  .macro .row { justify-content: space-between; flex-wrap: nowrap; }
  .macro code { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .games { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .game { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 3px 3px 11px; font-size: 12.5px; background: var(--bg); }
  .game button { background: none; border: 0; color: var(--faint); cursor: pointer; width: 22px; height: 22px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
  .game button .ico { width: 10px; height: 10px; }
  .game button:hover { color: var(--text); background: var(--line); }
  .kbwrap { overflow-x: auto; flex-basis: 100%; min-width: 0; max-width: 100%; }
  #kb { width: 100%; min-width: 600px; max-width: 1040px; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; flex-basis: 100%; }
  #kb rect { fill: var(--key-fill); stroke: var(--key-stroke); stroke-width: .03; transition: fill .12s; cursor: crosshair; }
  #kb g:hover rect { stroke: var(--muted); }
  #kb text { fill: var(--key-text); font-size: .24px; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  #remapkb { width: 100%; min-width: 600px; max-width: 1040px; height: auto; user-select: none; -webkit-user-select: none; }
  #remapkb rect { fill: var(--key-fill); stroke: var(--key-stroke); stroke-width: .03; }
  #remapkb text { fill: var(--key-text); font-size: .24px; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  #remapkb text.act { fill: var(--accent-text); font-size: .17px; }
  #remapkb g[data-row] { cursor: pointer; outline: none; }
  #remapkb g[data-row]:hover rect { stroke: var(--muted); }
  #remapkb g.changed rect { fill: var(--lit); stroke: var(--accent); }
  #remapkb g[aria-pressed=true] rect, #remapkb g[data-row]:focus-visible rect { stroke: var(--lit-edge); stroke-width: .07; }
  #remapkb g.none { opacity: .4; }
  .lightgrid { display: grid; gap: 3px; min-width: 600px; max-width: 1040px; }
  .lightgrid button { aspect-ratio: 1; min-width: 0; padding: 0; border: 1px solid var(--key-stroke); border-radius: 4px; background: var(--key-fill);
    color: var(--key-text); font-size: 10px; line-height: 1.1; overflow: hidden; cursor: pointer; overflow-wrap: anywhere; }
  .lightgrid button.named { border-color: var(--line-strong); color: var(--text); }
  .lightgrid button.none { color: var(--faint); }
  .lightgrid button.at { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .finder input { min-width: 240px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .hint b { color: var(--text); font-weight: 600; }

  /* Compare: every profile side by side (the old sheet), on request. */
  .compare { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 24px; }
  .sheet-wrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: max-content; min-width: 100%; }
  .band { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--lit); border-top: 3px solid var(--lit-edge); pointer-events: none;
    transition: transform .5s cubic-bezier(.16, 1, .3, 1), width .5s cubic-bezier(.16, 1, .3, 1); }
  @media (prefers-reduced-motion: reduce) { .band { transition: none; } }
  table.sheet { position: relative; width: 100%; border-collapse: separate; border-spacing: 0; }
  .sheet th, .sheet td { text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  .sheet tr:last-child > * { border-bottom: 0; }
  .sheet thead th { vertical-align: top; padding: 14px 14px 12px; font-weight: 400; min-width: 180px; }
  .sheet thead th:first-child { min-width: 170px; }
  .sheet tbody th { font-weight: 400; color: var(--muted); padding: 0 16px; white-space: nowrap; }
  .pname { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .live { font-size: 11.5px; font-weight: 600; color: var(--accent-text); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; }
  .mk { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .mk:hover { color: var(--text); border-color: var(--line-strong); }
  .sheet .games { margin-top: 6px; }
  .grp th { padding: 12px 16px 7px; background: var(--raise); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .sheet td { padding: 3px 6px; }
  .cell { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 40px; white-space: nowrap; }
  .cell:hover { border-color: var(--line-strong); background: var(--bg); }
  .cell .unset { color: var(--faint); }
  .cell.changed { color: var(--accent-text); }
  .c-other .cell { color: var(--muted); }
  .c-other .cell.changed { color: var(--accent-text); }
  .cell small { color: var(--muted); }

  /* All devices. */
  .overview { flex: 1; min-height: 0; overflow: auto; padding: 20px; }
  .ov-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
  .ov-head h1 { margin: 0; font-size: 20px; font-weight: 650; }
  .ov-head span { color: var(--muted); font-size: 13px; }
  .ov-group { display: flex; align-items: center; gap: 8px; margin: 26px 0 12px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .ov-group:first-child { margin-top: 0; }
  .ov-group .dart { width: 20px; height: 20px; }
  .ov-group span { color: var(--faint); font-weight: 400; }
  .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
  .dcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; cursor: pointer; display: grid; grid-template-columns: 48px minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 16px; row-gap: 16px; color: var(--text); transition: border-color .15s, transform .15s; }
  .dcard:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .dcard.muted { cursor: default; opacity: .6; }
  .dcard.muted:hover { transform: none; border-color: var(--line); }
  .dtile { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 11px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); transition: color .15s, border-color .15s; }
  .dtile .dart { width: 28px; height: 28px; }
  .dcard:hover .dtile { color: var(--accent); border-color: var(--line-strong); }
  .did { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .dsub { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; min-width: 0; }
  .dfoot { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); min-width: 0; }
  .dstats { display: flex; gap: 26px; min-width: 0; }
  .dstats div { display: flex; flex-direction: column; min-width: 0; }
  .dstats small { color: var(--muted); font-size: 12px; }
  .dstats b { color: var(--value); font-size: 17px; font-weight: 650; white-space: nowrap; }
  .dstats b.quiet { color: var(--muted); font-weight: 400; font-size: 14px; white-space: normal; }
  .dsub .ell { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dcard h3 { margin: 0; color: var(--text); font-size: 16.5px; font-weight: 650; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dcard .dots { flex-wrap: nowrap; gap: 6px; min-height: 0; }
  .dcard .dots i { width: 14px; height: 14px; }
  .dart { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dart .f { fill: currentColor; stroke: none; }
  .dots { display: flex; gap: 7px; min-height: 16px; flex-wrap: wrap; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; background: currentColor; border: 1px solid #00000066; }
  .dots i.off { background: none; border: 1.5px dashed var(--line-strong); }
  .batt { display: flex; align-items: center; gap: 6px; }
  .batt b { width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; }
  .batt b::after { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: calc((100% - 2px) * var(--lvl)); background: currentColor; border-radius: 1px; }
  .batt.low { color: var(--err); }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--toast); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; opacity: 0; transition: .2s; pointer-events: none; font-size: 13px; box-shadow: var(--shadow); z-index: 20; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.err { border-color: var(--err); color: var(--err-text); }
  #toast.act { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding-right: 8px; }
  #toast button { background: none; border: 1px solid var(--accent); color: var(--text); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-weight: 600; }

  /* Medium windows: a narrower panel. */
  @media (max-width: 1180px) { .work { grid-template-columns: 172px minmax(0, 1fr) 330px; } .work.wide { grid-template-columns: 172px minmax(0, 1fr); } }
  /* Small windows and phones: sections become tabs, the panel slides up from the bottom. */
  @media (max-width: 820px) {
    body { overflow: auto; display: block; }
    header.top { padding: 8px 12px; gap: 8px 10px; height: auto; flex-wrap: wrap; }
    #tabsRow { order: 3; flex-basis: 100%; }
    .actions { margin-left: auto; flex: 1 1 auto; flex-wrap: wrap; justify-content: flex-end; row-gap: 8px; min-width: 0; }
    .synclabel { display: none; }
    .devbar { flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
    .who { max-width: none; flex: 1; }
    #profilesRow { order: 3; flex-basis: 100%; }
    .work, .work.wide { display: block; }
    .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; position: sticky; top: 0; z-index: 3; }
    .sec { flex: none; padding: 6px 12px; }
    .sec span { display: none; }
    .rail.more-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
    .tiles { padding: 14px 12px 90px; }
    .tgrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .keypad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 58vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); z-index: 10;
      transform: translateY(105%); transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
    .work.has-sel .panel { transform: none; }
    .work.has-sel .tiles { padding-bottom: 60vh; }
    .work.wide .tiles { display: block; }
    .work.wide .edbox { flex-direction: column; }
    .compare, .overview { padding: 14px 12px; }
  }

  .macro .row { flex-wrap: wrap; }
  .macro .row b { flex: 1 1 100%; }
  @media (max-width: 820px) { .themepick select { max-width: 96px; } }
  /* Settings: the app's own options, in groups of rows (label and help on the left, control on the right). */
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .gear { width: 34px; height: 34px; padding: 0; justify-content: center; }
  .gear .ico { width: 16px; height: 16px; }
  .gear[aria-pressed=true] { color: var(--text); border-color: var(--accent); }
  .settings { flex: 1; min-height: 0; overflow: auto; padding: 28px 20px 90px; }
  .set-wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
  .set-head h1 { margin: 0; font-size: 20px; font-weight: 650; }
  .set-head p { margin: 4px 0 0; color: var(--muted); }
  .set-group h2 { margin: 0 0 8px 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .set-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 24px; padding: 14px 18px; }
  .set-row + .set-row { border-top: 1px solid var(--line); }
  .set-row b { display: block; font-size: 15px; font-weight: 600; }
  .set-row small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; max-width: 60ch; line-height: 1.45; }
  .set-ctl { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .set-ctl .out { color: var(--value); font-weight: 600; font-size: 13px; }
  .set-row .wide { grid-column: 1 / -1; }
  :root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  @media (max-width: 820px) {
    .settings { padding: 16px 12px 90px; }
    .set-row { grid-template-columns: 1fr; }
    .set-ctl { justify-content: flex-start; }
  }
  .addgame, .del { background: none; border: 0; padding: 3px 2px; font-size: 12.5px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .addgame:hover, .addgame:focus-visible { color: var(--text); }
  .del { color: var(--faint); margin-top: 6px; display: flex; }
  .del:hover { color: var(--err-text); }
  .gamein { width: 150px; padding: 4px 9px !important; font-size: 12.5px; }
  /* Every theme goes bold in its own colour: the live profile, current section, selected tile
     and pressed segment are solid --fill (the accent, or a lighter tint in Light) with the
     theme's on-accent text (4.5:1 or more), edged in the accent, and
     the device tab in use is outlined in it. */
  .tile[aria-pressed=true] { background: var(--fill); border-color: var(--accent); }
  .tile[aria-pressed=true] .tl, .tile[aria-pressed=true] .tv, .tile[aria-pressed=true] .tv small, .tile[aria-pressed=true] .tv .unset,
  .tile[aria-pressed=true] .big, .tile.changed[aria-pressed=true] .tl::after { color: var(--on-accent); }
  .pbtn[aria-current=true], .pbtn[aria-current=true]:hover { background: var(--fill); color: var(--on-accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pbtn[aria-current=true] .g { color: var(--on-accent); }
  .uline { display: none; }
  .sec[aria-current=true] { background: var(--fill); border-color: var(--accent); }
  .sec[aria-current=true] b, .sec[aria-current=true] span { color: var(--on-accent); }
  .seg button[aria-pressed=true] { background: var(--fill); color: var(--on-accent); box-shadow: none; }
  .tab[aria-selected=true] { border-color: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="home" title="All devices"><img src="{{LOGO}}" alt="">Secretarybird</button>
  <div class="scrollrow" id="tabsRow"><nav class="tabs" id="tabs" aria-label="Devices"></nav></div>
  <div class="actions">
    <div class="sync" id="sync" hidden>
      <label class="mini" title="Color to sync"><input type="color" id="syncColor" value="#ff2800" aria-label="Color to sync"></label>
      <button id="syncBtn" title="Same color on every device with lighting control enabled">Sync<span class="synclabel"> color everywhere</span></button>
    </div>
    <button class="ghost" id="rescan">Rescan</button>
    <label class="themepick" title="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      <select id="theme" aria-label="Theme">
        <option value="">Auto</option><option value="bridge">Bridge</option><option value="roast">Roast</option><option value="classic">Classic</option>
        <option value="light">Light</option><option value="workshop">Workshop</option><option value="neon">Neon</option><option value="acid">Acid</option>
      </select></label>
    <button class="ghost gear" id="gear" title="Settings" aria-label="Settings" aria-pressed="false"></button>
  </div>
</header>
<p class="banner" id="synBanner" hidden>Razer Synapse is running and can overwrite these settings. Close it, or run <code>secbird debloat</code> to stop it starting with Windows.</p>

<main id="main">
  <p class="empty" id="empty" hidden>No Razer devices found. Plug one in, then press Rescan.</p>

  <section class="overview" id="overview" hidden>
    <div class="ov-head"><h1>All devices</h1><span id="ovSummary"></span></div>
    <div id="ovGroups"></div>
  </section>

  <div class="devbar" id="devbar" hidden>
    <svg viewBox="0 0 240 360" id="preview" aria-hidden="true">
      <path id="z-underglow" class="zone-shape" fill="none" stroke-width="12"
        d="M120 26C72 26 52 64 50 122c-2 68 8 124 24 172 13 34 79 34 92 0 16-48 26-104 24-172-2-58-22-96-70-96z"/>
      <path class="m-body" stroke-width="6"
        d="M120 18C70 18 46 60 44 120c-2 70 8 130 26 180 14 36 86 36 100 0 18-50 28-110 26-180-2-60-26-102-76-102z"/>
      <path d="M120 22v112M47 132c40 14 106 14 146 0" fill="none" class="m-line" stroke-width="6"/>
      <rect id="z-scroll" class="zone-shape" x="104" y="50" width="32" height="56" rx="16"/>
      <circle id="z-logo" class="zone-shape" cx="120" cy="246" r="24"/>
    </svg>
    <div class="who">
      <h1 id="name"></h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="scrollrow" id="profilesRow"><nav class="profiles" id="profiles" aria-label="Profiles"></nav></div>
    <div class="devright">
      <button class="ghost" id="compareBtn" aria-pressed="false" title="Every profile side by side">Compare</button>
    </div>
  </div>

  <div class="work" id="work" hidden>
    <nav class="rail" id="rail" aria-label="Settings"></nav>
    <section class="tiles" id="tiles" aria-live="polite"></section>
    <aside class="panel" id="panel" aria-label="Edit"></aside>
  </div>

  <section class="settings" id="settings" hidden aria-label="Settings"></section>

  <section class="compare" id="compare" hidden>
    <div class="sheet-wrap" id="sheetWrap">
      <div class="band" id="band"></div>
      <table class="sheet" id="sheet"></table>
    </div>
  </section>
</main>

    tools.append(seg);
  } else if (cur.tools === 'allzones') {
    tools.append(el('button', { className: 'link', textContent: 'Same on all zones', title: 'The colour or effect of the zone you changed last, on every zone',
      onclick: () => { const src = sourceZone(); if (src) copyToZones(src); else toast('Pick a color or effect for one zone first', true); } }));
  }
  head.append(tools);
  t.append(head);
  if (cur.loading) {
    const g = el('div', { className: 'tgrid' });
    for (let i = 0; i < 8; i++) g.append(el('div', { className: 'skel' }));
    t.append(g, el('p', { className: 'hint', textContent: isBoard()
      ? 'Reading every key from the ' + holder() + '. This takes a few seconds…' : 'Reading the buttons from the mouse…' }));
    return;
  }
  if (cur.id === 'buttons' && isBoard()) return keyTiles(t, cur);
  // Side plates (Naga) are drawn as keypads, the way they sit on the mouse.
  const plain = cur.rows.filter(r => !/^btn:(grid|hex)-/.test(r.key));
  const grid = cur.rows.filter(r => /^btn:grid-/.test(r.key));
  const hex = cur.rows.filter(r => /^btn:hex-/.test(r.key));
  const g = el('div', { className: 'tgrid' });
  plain.forEach(r => g.append(tile(r)));
  t.append(g);
  if (grid.length) {
    t.append(el('p', { className: 'subhead', textContent: 'Side grid' }));
    const k = el('div', { className: 'keypad' });
    grid.forEach(r => k.append(tile(r, r.key.slice(9))));
    t.append(k);
  }
  if (hex.length) {
    t.append(el('p', { className: 'subhead', textContent: '6-button side plate' }));
    const k = el('div', { className: 'keypad' });
    hex.forEach(r => k.append(tile(r, r.key.slice(8))));
    t.append(k);
  }
}

const BOARDS = ['keyboard', 'keypad', 'laptop'];
const isBoard = () => BOARDS.includes(dev.kind);
const holder = () => dev.kind === 'mouse' ? 'mouse' : (KINDS[dev.kind] || 'device').toLowerCase();

// The keyboard drawn for remapping. Key ids are key positions, not lights, so a board whose
// lights aren't mapped still gets a standard drawing: full size if it has a numpad, else
// tenkeyless. Keypads get tiles.
// The size comes from the light grid: 5 rows is 60% (15 columns) or 65%, 6 rows of 16 or 17
// columns is 75%. With no grid, a numpad key in the key list means full size.
function remapLayout() {
  if (dev.kind === 'keypad') return null;
  const m = dev.matrix;
  if (m && knownLayout(m, dev.kind)) return layout(m, dev.kind);
  const cols = m && m.cols - ((m.first ?? 1) - 1);
  if (m && m.rows <= 5) return cols <= 15 ? layout({ rows: 5, cols: 15 }, 'keyboard') : compactBoard(false);
  if (m && cols < 18) return compactBoard(true);
  const numpad = m ? cols >= 20 : (btnData[dev.id] || []).some(b => b.name === 'key-num5');
  return layout(numpad ? { rows: 6, cols: 22 } : { rows: 6, cols: 18 }, 'keyboard');
}
// 75% (fRow) and 65% boards: the full-size main block, a column of navigation keys, and the
// arrows tucked in at the bottom right. Drawn for remapping only; the columns aren't lights.
function compactBoard(fRow) {
  const nav = fRow ? ['Del', 'Home', 'PgUp', 'PgDn'] : [null, 'Del', 'PgUp', 'PgDn'];
  const rows = FULLSIZE.map((keys, row) => {
    let main = keys.filter(k => k[1] <= 14);
    if (row === 1 && !fRow) main = main.map(k => k[0] === '`' ? ['Esc', 1] : k);
    if (row === 4) main = main.map(k => k[1] === 14 ? ['Shift', 14, 1.75] : k);
    if (row === 5) main = main.filter(k => k[0] !== 'Menu').map(k => k[1] > 7 ? [k[0], k[1], 1] : k);
    const right = row === 4 ? [['↑', 16, 1, .25], ['End', 17]] : row === 5 ? [['←', 15, 1, .25], ['↓', 16], ['→', 17]] : [[nav[row], 15, 1, .25]];
    return [...main, ...right];
  }).slice(fRow ? 0 : 1);
  return isoKeys(nameKeys(rows.flatMap((keys, row) => {
    let x = 0;
    return keys.map(([label, col, w = 1, gap = 0, h = 1]) => {
      x += gap;
      const k = { label, row, col, x, y: row + (fRow && row ? .25 : 0), w, h };
      x += w; return k;
    });
  })));
}
function isoKeys(keys) { return kbLayout() === 'ansi' ? keys : isoLayout(keys, kbLayout() === 'de' ? DE_LABELS : null); }

// Keys section: click a key on the drawing. Keys the drawing doesn't have (Japanese keys,
// keypads) are tiles below it.
function keyTiles(t, cur) {
  if (!cur.rows.length) {
    t.append(el('p', { className: 'hint', textContent: btnFailed[dev.id] ? 'Couldn’t read the keys. Unplug and replug it, then open this again.'
      : btnLayer === 'hypershift' ? 'This ' + holder() + ' has no HyperShift layer to change.'
      : 'Key remapping isn’t supported on this ' + holder() + ' yet. It doesn’t take Razer’s remap commands, so it needs a remap done by Secretarybird itself, which is planned after 0.5.' }));
    return;
  }
  const rows = new Map(cur.rows.map(r => [r.key, r])), drawn = new Set(), keys = remapLayout();
  if (keys) {
    const w = Math.max(...keys.map(k => k.x + k.w)), h = Math.max(...keys.map(k => k.y + k.h));
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'remapkb'; svg.setAttribute('viewBox', `-0.05 -0.05 ${w + 0.1} ${h + 0.1}`);
    svg.setAttribute('aria-label', 'Keyboard: pick a key to change what it does');
    svg.innerHTML = keys.map(k => {
      const r = k.name && rows.get('btn:key-' + k.name);
      const box = `<rect x="${k.x + .05}" y="${k.y + .05}" width="${k.w - .1}" height="${k.h - .1}" rx=".12"/>`;
      if (!r) return `<g class="none">${box}<text x="${k.x + k.w / 2}" y="${k.y + k.h / 2}">${esc(k.label)}</text></g>`;
      drawn.add(r.key);
      const [html, changed] = cellView(r.key, dev.active);
      const what = el('span', { innerHTML: html }).textContent.replace(/^Key /, '');
      const short = what.length > 8 ? what.slice(0, 7) + '…' : what;
      return `<g data-row="${esc(r.key)}" class="${changed ? 'changed' : ''}" tabindex="0" role="button" aria-pressed="${sel === r.key}"` +
        ` aria-label="${esc(r.label + ': ' + what + (changed ? ' (changed)' : ''))}"><title>${esc(r.label + ': ' + what)}</title>${box}` +
        (changed ? `<text x="${k.x + k.w / 2}" y="${k.y + k.h * .34}">${esc(k.label)}</text><text class="act" x="${k.x + k.w / 2}" y="${k.y + k.h * .7}">${esc(short)}</text>`
          : `<text x="${k.x + k.w / 2}" y="${k.y + k.h / 2}">${esc(k.label)}</text>`) + '</g>';
    }).join('');
    const pick = e => { const g = e.target.closest && e.target.closest('g[data-row]'); if (g) select(g.dataset.row); };
    svg.onclick = pick;
    svg.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); } };
    t.append(el('div', { className: 'kbwrap' }, svg));
    if (!(dev.matrix && knownLayout(dev.matrix, dev.kind))) t.append(el('p', { className: 'hint', textContent:
      'Drawn as a standard keyboard: yours may not have every key shown. Greyed keys can’t be changed.' }));
  }
  const rest = cur.rows.filter(r => !drawn.has(r.key));
  if (!rest.length) return;
  const g = el('div', { className: 'tgrid' });
  rest.forEach(r => g.append(tile(r)));
  if (!keys) return t.append(g);
  // Keys the drawing doesn't have (ISO, Japanese, a smaller board's numpad): folded away unless
  // one is in use.
  const open = rest.some(r => r.key === sel || cellView(r.key, dev.active)[1]);
  t.append(el('details', { className: 'morekeys', open }, el('summary', { className: 'subhead', textContent: `${plural(rest.length, 'more key')}, not on the drawing` }), g));
}

function tile(r, short) {
  const [html, changed] = cellView(r.key, dev.active);
  const b = el('button', { className: 'tile' + (changed ? ' changed' : ''), ariaPressed: sel === r.key,
    ariaLabel: r.label + (changed ? ' (changed)' : ''), onclick: () => select(r.key) },
    el('span', { className: 'tl', textContent: short || r.label }), el('span', { className: 'tv', innerHTML: html }));
  b.dataset.row = r.key;
  if (short) b.title = r.label;
  return b;
}

function select(key) {
  sel = sel === key ? null : key;
  renderWork();
  if (sel && matchMedia('(max-width: 820px)').matches) { // keep the tile in sight above the sheet
    const t = document.querySelector(`.tile[data-row="${CSS.escape(sel)}"]`);
    if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  if (sel) {
    const first = $('panel').querySelector('.pbody button, .pbody input, .pbody select, .pbody textarea');
    if (first && matchMedia('(min-width: 821px)').matches) first.focus({ preventScroll: true });
  }
}

function renderPanel(cur) {
  stopFinding();
  const p = $('panel');
  p.innerHTML = '';
  const r = sel && cur.rows.find(x => x.key === sel);
  if (!r) {
    p.append(el('div', { className: 'phead' }, el('h2', { textContent: 'Live now: ' + dev.active })),
      el('div', { className: 'pbody' }, liveSummary()));
    return;
  }
  const title = r.label + (r.key.startsWith('btn:') && btnLayer === 'hypershift' ? ' · HyperShift' : '');
  p.append(el('div', { className: 'phead' },
    el('h2', { textContent: title }),
    el('button', { className: 'xbtn', innerHTML: icon('x'), title: 'Close (Esc)', ariaLabel: 'Close', onclick: closePanel })));
  const body = el('div', { className: 'pbody' });
  p.append(body);
  buildEditor(body, r);
}

function closePanel() {
  const was = sel; sel = null; renderWork();
  const t = was && document.querySelector(`.tile[data-row="${CSS.escape(was)}"]`);
  if (t) t.focus({ preventScroll: true });
}

// The panel with nothing selected: what is live, and how saving works.
function liveSummary() {
  const p = dev.profile, apps = p.apps || [];
  const box = el('div', { className: 'edbox' });
  box.append(el('div', { className: 'edgroup' },
    el('p', { className: 'hint', innerHTML: `<b>${esc(dev.active)}</b> is live on this ${esc((KINDS[dev.kind] || 'device').toLowerCase())}.` +
      (apps.length ? ` It also comes up while ${esc(apps.join(', '))} ${apps.length === 1 ? 'is' : 'are'} in front.` : '') }),
    el('p', { className: 'hint', textContent: 'Pick a setting to change it. Changes apply right away and are saved to ' + dev.active + '; there is nothing to save or close.' })));
  if (dev.kind === 'mouse') box.append(el('p', { className: 'note', textContent: 'Button changes go to the mouse’s live memory; Restore puts back what Synapse or the factory stored in it.' }));
  if (dev.profiles.length > 1) box.append(el('p', { className: 'note', textContent: 'Compare shows every profile side by side.' }));
  return box;
}

// Esc closes the panel (and returns to its tile), or leaves Compare.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.target.classList.contains('combo')) return;
  if (showSettings) { showSettings = false; render(); return; }
  if (view === 'compare') { view = 'work'; render(); return; }
  if (sel) closePanel();
});

// Open a setting from anywhere (the live preview, a Compare cell): switch profile if needed.
async function toggleEditor(row, name) {
  if (name !== dev.active) {
    const ok = await activate(name, true); if (!ok) return;
  }
  view = 'work';
  section = sectionOf(row) || section;
  sel = null;
  render();
  select(row);
}
function focusCell(row) {
  const t = document.querySelector(`.tile[data-row="${CSS.escape(row)}"]`);
  if (t) t.focus({ preventScroll: true });
}
// Data changed: redraw what shows it, leaving an open editor alone.
function renderSheet() {
  if (!dev || showAll) return;
  if (view === 'compare') renderCompare(); else renderWork(true);
}
// One value changed: update its tile, the rail line, and its Compare cell.
function refreshCell(row) {
  if (view === 'compare') return renderCompare();
  const t = document.querySelector(`.tile[data-row="${CSS.escape(row)}"]`);
  if (t) {
    const [html, changed] = cellView(row, dev.active);
    t.querySelector('.tv').innerHTML = html; t.classList.toggle('changed', !!changed);
  }
  if (document.querySelector(`#remapkb g[data-row="${CSS.escape(row)}"]`)) renderTiles(sections().find(s => s.id === section));
  renderRail(sections());
}

// ---------- Compare: every profile side by side ----------

function renderCompare() {
  const t = $('sheet'), names = dev.profiles, secs = sections().filter(s => !['macros', 'profile', 'device'].includes(s.id) && (s.id !== 'light' || dev.lighting_control));
  if (secs.some(s => s.id === 'buttons')) loadButtons(dev);
  // Buttons that play a macro show its name, so the list is needed here too.
  if (dev.macros && macroData[dev.id] === undefined) loadMacros(dev);
  t.innerHTML = '';
  const head = el('tr');
  head.append(el('th', { scope: 'col' }, el('span', { className: 'hint', textContent: 'Setting' })));
  names.forEach(n => head.append(profileHeader(n)));
  t.append(el('thead', {}, head));
  const span = names.length + 1;
  secs.forEach(s => {
    const body = el('tbody');
    body.append(el('tr', { className: 'grp' }, el('th', { colSpan: span, scope: 'rowgroup', textContent: s.name + (s.id === 'buttons' && btnLayer === 'hypershift' ? ' · HyperShift' : '') })));
    let rowsOf = s.loading ? [{ key: 'loading', label: 'Reading buttons…' }] : s.rows.filter(r => r.key !== 'lighting-control');
    // A keyboard has a hundred keys: only those some profile changes.
    if (s.id === 'buttons' && isBoard() && !s.loading) {
      const skey = r => btnLayer === 'normal' ? r.name : r.name + '/hypershift';
      rowsOf = rowsOf.filter(r => names.some(n => (prof(n).buttons || {})[skey(r)]));
      if (!rowsOf.length) rowsOf = [{ key: 'loading', label: 'No profile changes a key' }];
    }
    rowsOf.forEach(r => {
      const tr = el('tr');
      tr.append(el('th', { scope: 'row', textContent: r.label }));
      names.forEach(n => {
        const [html, remapped] = cellView(r.key, n);
        const changed = n === dev.active ? remapped : differs(r.key, n);
        const b = el('button', { className: 'cell' + (changed ? ' changed' : ''), innerHTML: html, disabled: r.key === 'loading',
          ariaLabel: `${r.label} in ${n}` + (n === dev.active ? '' : ' (makes it live)'), onclick: () => toggleEditor(r.key, n) });
        tr.append(el('td', { className: n === dev.active ? 'c-on' : 'c-other' }, b));
      });
      body.append(tr);
    });
    t.append(body);
  });
  requestAnimationFrame(placeBand);
}
$('compareBtn').onclick = () => { view = view === 'compare' ? 'work' : 'compare'; sel = null; render(); };

// Comparable value of a cell, to mark where another profile differs from the active one.
function cellValue(key, name) {
  const p = prof(name), active = name === dev.active;
  if (key.startsWith('zone:')) { const z = zoneOf(p, key.slice(5)); return p.keys && p.keys.length && dev.matrix ? 'keys' : z.off ? 'off' : (z.effect || z.color || '') + '/' + (z.brightness ?? 100); }
  if (key === 'keys') return (p.keys || []).join();
  if (key === 'dpi') return String(active && dev.dpi ? [dev.dpi.x, dev.dpi.y] : p.dpi || '');
  if (key === 'polling') return String(active && dev.polling ? dev.polling.hz : p.polling || '');
  if (key === 'stages') { const st = stagesOf(name); return st ? st.active + ':' + st.list.join(' ') : ''; }
  if (key === 'sleep') { const sl = sleepOf(name); return sl ? sl.auto + ':' + sl.minutes : ''; }
  if (key === 'dimming') return dimmingOf(name) || '';
  if (key === 'gaming') return gamingOf(name) || '';
  if (key === 'macros' || key === 'onboard') return 'shared'; // the device's, the same in every profile
  if (key.startsWith('btn:')) {
    const b = (btnData[dev.id] || []).find(x => x.name === key.slice(4)); if (!b) return '';
    const skey = btnLayer === 'normal' ? b.name : b.name + '/hypershift';
    return active ? b[btnLayer] : (p.buttons && p.buttons[skey]) || b.saved[btnLayer] || b[btnLayer];
  }
  return '';
}
const differs = (key, name) => name !== dev.active && cellValue(key, name) !== cellValue(key, dev.active);

// What one cell says: [html, changed?]. Active column: changed = remapped from what the
// mouse saved. Other columns get their mark from differs().
function cellView(key, name) {
  const p = prof(name), active = name === dev.active;
  if (key === 'lighting-control') return [dev.lighting_control ? 'Secretarybird' : '<span class="unset">Not controlled</span>'];
  if (key === 'onboard') {
    const o = onboardData[dev.id];
    if (!o) return ['<span class="unset">Not saved</span>'];
    if (o.profile !== name) return ['<span class="unset">Not this profile</span>'];
    return [`Slot <span class="num">${o.slot}</span>` + (o.changed ? ' · <span class="unset">changed since</span>' : '')];
  }
  if (key.startsWith('zone:')) {
    const z = zoneOf(p, key.slice(5));
    if (p.keys && p.keys.length && dev.matrix) return ['<span class="unset">Per-key colors</span>'];
    if (z.off) return ['<span class="sw off"></span>Off'];
    if (z.effect) return [esc(effectLabel(z.effect))];
    if (!z.color) return ['<span class="unset">Not set</span>'];
    return [`<span class="sw" style="background:#${esc(z.color)}"></span><span class="num">#${esc(z.color)}</span>` +
      (z.brightness != null && z.brightness !== 100 ? ` <small class="num">${z.brightness}%</small>` : '')];
  }
  if (key === 'keys') {
    if (!p.keys || !p.keys.length) return ['<span class="unset">Whole keyboard</span>'];
    const colors = [...new Set(p.keys.filter(k => k !== '000000'))];
    return [colors.slice(0, 5).map(c => `<span class="sw" style="background:#${esc(c)}"></span>`).join('') + ` <small>${plural(colors.length, 'color')}</small>`];
  }
  if (key === 'dpi') {
    const d = active && dev.dpi ? [dev.dpi.x, dev.dpi.y] : p.dpi;
    if (!d) return ['<span class="unset">Not set</span>'];
    return [`<span class="big num">${d[0] === d[1] ? d[0] : d[0] + ' × ' + d[1]}</span> <small>DPI</small>`];
  }
  if (key === 'polling') {
    const v = active && dev.polling ? dev.polling.hz : p.polling;
    return v ? [`<span class="num">${hz(v)}</span>`] : ['<span class="unset">Not set</span>'];
  }
  if (key === 'stages') {
    const st = stagesOf(name);
    if (!st) return ['<span class="unset">Not set</span>'];
    return [st.list.map((d, i) => { const v = d[0] === d[1] ? d[0] : d[0] + '×' + d[1];
      return i + 1 === st.active ? `<b class="num">${v}</b>` : `<span class="num">${v}</span>`; }).join(' · ')];
  }
  if (key === 'dimming') {
    const d = dimmingOf(name);
    return [d ? DIMMING[d] : '<span class="unset">Not set</span>'];
  }
  if (key === 'gaming') {
    const g = gamingOf(name);
    return [g ? gamingText(g) : '<span class="unset">Not set</span>'];
  }
  if (key === 'sleep') {
    const sl = sleepOf(name);
    if (!sl) return ['<span class="unset">Not set</span>'];
    return [sl.auto === false ? 'Never' : `After <span class="num">${sl.minutes}</span> min`];
  }
  if (key === 'macros') {
    const m = macroData[dev.id];
    if (!m) return ['<span class="unset">…</span>'];
    return [m.macros.length ? `${plural(m.macros.length, 'macro')} <small>· every profile</small>` : '<span class="unset">None yet</span>'];
  }
  if (key === 'loading') return ['<span class="unset">…</span>'];
  if (key === 'apps') { const a = p.apps || []; return [a.length ? esc(a.join(', ')) : '<span class="unset">No games yet</span>']; }
  if (key === 'device') return [esc(dev.firmware ? 'Firmware ' + dev.firmware : KINDS[dev.kind] || 'Device')];
  if (key.startsWith('btn:')) {
    const b = (btnData[dev.id] || []).find(x => x.name === key.slice(4)); if (!b) return [''];
    const skey = btnLayer === 'normal' ? b.name : b.name + '/hypershift';
    if (active) return [esc(actionLabel(b[btnLayer])), b.remapped[btnLayer]];
    const own = p.buttons && p.buttons[skey];
    return [esc(actionLabel(own || b.saved[btnLayer] || b[btnLayer]))];
  }
  return [''];
}

// The lit band sits behind the active profile's column and slides when it changes.
function placeBand() {
  const th = $('sheet').querySelector('thead th.c-on'), band = $('band');
  if (!th) { band.style.width = '0'; return; }
  band.style.width = th.offsetWidth + 'px';
  band.style.transform = `translateX(${th.offsetLeft}px)`;
}

function profileHeader(n) {
  const active = n === dev.active, p = prof(n);
  const th = el('th', { scope: 'col', className: active ? 'c-on' : 'c-other' });
  const title = el('div', { className: 'pname' }, el('span', { textContent: n }),
    active ? el('span', { className: 'live', textContent: 'Active' })
      : el('button', { className: 'mk', textContent: 'Make active', onclick: () => activate(n) }));
  const games = el('div', { className: 'games' });
  (p.apps || []).forEach(a => games.append(el('span', { className: 'game' }, a,
    el('button', { innerHTML: icon('x'), title: 'Remove ' + a, ariaLabel: `Remove ${a} from ${n}`, onclick: () => saveApps(n, (p.apps || []).filter(v => v !== a), 'Removed ' + a) }))));
  const add = el('button', { className: 'addgame', innerHTML: icon('plus') + ((p.apps || []).length ? 'Game' : 'Game or app'),
    title: `Switch to ${n} while this program is in front` });
  add.onclick = () => {
    const input = el('input', { type: 'text', className: 'gamein', placeholder: 'cs2.exe', autocomplete: 'off', ariaLabel: `Program that brings up ${n}` });
    input.setAttribute('list', 'appList-' + n.replace(/\W/g, '_'));
    const list = el('datalist', { id: 'appList-' + n.replace(/\W/g, '_') });
    api('/api/apps').then(r => r.apps.filter(a => !(p.apps || []).includes(a)).forEach(a => list.append(new Option(a)))).catch(() => {});
    const done = () => { input.replaceWith(add); list.remove(); };
    input.onkeydown = e => {
      if (e.key === 'Escape') done();
      if (e.key === 'Enter' && input.value.trim()) { saveApps(n, [...(p.apps || []), input.value.trim()], 'Added ' + input.value.trim() + ' to ' + n); }
    };
    input.onblur = () => setTimeout(() => { if (document.activeElement !== input) done(); }, 150);
    add.replaceWith(input); input.after(list); input.focus();
  };
  games.append(add);
  th.append(title, games);
  if (dev.profiles.length > 1) th.append(el('button', { className: 'del', textContent: 'Delete profile', onclick: () => deleteProfile(n) }));
  return th;
}

    const k = sel.value;

// Lights one cell of the board's grid at a time; the user types the key that lit up, and the
// list goes into a GitHub issue. Maps boards whose layout is wrong or unknown (#45, #27, #41)
// without guessing. Nothing is saved on the device; leaving puts the profile's lighting back.
let finding = null;
function findLights(box) {
  const { rows, cols } = dev.matrix, mem = 'lightmap-' + dev.id;
  let names = {};
  try { names = JSON.parse(remembered(mem) || '{}'); } catch { }
  let at = 0;
  const known = knownLayout(dev.matrix, dev.kind) ? layout(dev.matrix, dev.kind) : [];
  const guess = Object.fromEntries(known.filter(k => k.label).map(k => [k.row * cols + k.col, k.label]));
  const show = live(i => api('/api/find-light', { light: [Math.floor(i / cols), i % cols] }), () => null);
  finding = dev.id;
  const where = el('p', { className: 'hint', ariaLive: 'polite' });
  const input = el('input', { type: 'text', placeholder: 'e.g. Num ,  or  Volume dial', ariaLabel: 'Key that lit up' });
  const grid = el('div', { className: 'lightgrid', style: `grid-template-columns: repeat(${cols}, minmax(0, 1fr))` });
  const cells = [];
  for (let i = 0; i < rows * cols; i++) {
    const b = el('button', { title: `Row ${Math.floor(i / cols) + 1}, light ${i % cols + 1}`, onclick: () => go(i) });
    cells.push(b); grid.append(b);
  }
  const keep = () => {
    const v = input.value.trim();
    if (v) names[at] = v; else delete names[at];
    remember(mem, JSON.stringify(names));
  };
  const draw = () => cells.forEach((b, i) => {
    const n = names[i];
    b.textContent = n === '-' ? '–' : n || '';
    b.className = (i === at ? 'at ' : '') + (n === '-' ? 'none' : n ? 'named' : '');
  });
  const go = i => {
    keep();
    at = (i + rows * cols) % (rows * cols);
    input.value = names[at] || '';
    where.textContent = `Row ${Math.floor(at / cols) + 1} of ${rows}, light ${at % cols + 1} of ${cols} is lit. Which key is it?` +
      (guess[at] ? ` The editor has it as “${guess[at]}”.` : '');
    draw(); show(at); input.focus();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); go(at + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); go(at - cols); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); go(at + cols); }
  };
  const copy = async () => {
    keep();
    const done = Object.keys(names).map(Number).sort((a, b) => a - b);
    const lines = done.map(i => `${Math.floor(i / cols) + 1},${i % cols + 1}: ${names[i] === '-' ? '(nothing)' : names[i]}`);
    const text = `Light map for ${dev.name} (${dev.pid}), ${rows} x ${cols} grid, row,light: key\n` + lines.join('\n');
    try { await navigator.clipboard.writeText(text); toast(`Copied ${done.length} of ${rows * cols}. Paste it into your GitHub issue`); }
    catch (e) { toast(e.message, true); }
  };
  box.append(
    el('div', { className: 'edgroup' }, el('h3', { textContent: 'Find which light is which key' }),
      el('p', { className: 'note', textContent: 'One light on your keyboard is on at a time. Type the key it is under and press Enter for the next one. Keys that stay dark: press Nothing lit. Click any square to jump to it. Your answers are kept if you stop halfway.' }),
      where,
      el('div', { className: 'row finder' }, input,
        el('button', { className: 'ghost', textContent: 'Nothing lit', onclick: () => { input.value = '-'; go(at + 1); } }),
        el('button', { className: 'ghost', innerHTML: icon('left'), ariaLabel: 'Previous light', title: 'Previous', onclick: () => go(at - 1) }),
        el('button', { className: 'ghost', innerHTML: icon('right'), ariaLabel: 'Next light', title: 'Next', onclick: () => go(at + 1) })),
      el('div', { className: 'row' },
        el('button', { textContent: 'Copy the list', onclick: copy }),
        el('button', { className: 'ghost', textContent: 'Done', onclick: () => { keep(); stopFinding(); box.innerHTML = ''; keysEditor(box); } }))),
    el('div', { className: 'kbwrap' }, grid));
  go(0);
}
// Put the profile's lighting back after finding lights (also when the page is closed).

// DPI stages of a profile: the active column shows the mouse, following its DPI button.
function stagesOf(name) {
  if (name !== dev.active || !dev.stages) {
    const s = prof(name).dpi_stages;
    return s ? { active: s.active, list: s.stages } : null;
  }
  const list = dev.stages.list;
  const at = dev.dpi ? list.findIndex(d => d[0] === dev.dpi.x && d[1] === dev.dpi.y) : -1;
  return { active: at >= 0 ? at + 1 : dev.stages.active, list };
}

function stagesEditor(box) {
  const target = dev, profile = target.profile;
  const d = target.dpi || { min: 100, max: 30000, step: 50 };

    rowsBox.innerHTML = '';

      const values = el('div', { className: 'stage-values' });

        const upper = axis.toUpperCase();
        const num = el('input', { type: 'number', className: 'dpi num', min: d.min, max: d.max, step: d.step, value: v[at],
          ariaLabel: `Stage ${i + 1} ${upper} DPI`, onchange: e => {
            const pair = dpiPair(list[i], e.target.value, axis, dpiLinked.get(target.id) === true, d);
            if (pair) { list[i] = pair; save(); } else draw();
          } });
        values.append(el('label', {}, upper, num));
      }
      const use = el('input', { type: 'radio', name: 'stageUse', checked: i + 1 === active, id: 'stageUse' + i,
        onchange: () => { active = i + 1; save(); } });
      const del = el('button', { className: 'ghost', innerHTML: icon('x'), title: 'Remove stage ' + (i + 1), ariaLabel: 'Remove stage ' + (i + 1),
        disabled: list.length === 1, onclick: () => { list.splice(i, 1); if (active > i + 1 || active > list.length) active = Math.max(1, active - 1); save(); } });
      rowsBox.append(el('div', { className: 'stage-row' }, el('span', { className: 'val num', textContent: i + 1 }), values, del,
        el('label', { className: 'row stage-use' }, use, 'In use')));
    });
    add.disabled = list.length >= target.stages.max;
  };
  add.onclick = () => { list.push(list[list.length - 1].map(v => Math.min(d.max, v * 2))); save(); };
  let revision = 0;

      target.stages.list = r.stages.list; target.stages.active = r.stages.active;
