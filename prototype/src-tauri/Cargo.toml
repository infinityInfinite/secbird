[package]
name = "secbird-desktop-demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Secbird desktop UI with passive Razer device enumeration"

# Deliberately independent from the original hardware workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secbird-core = { path = "../../crates/secbird-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
